name: build-release

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  ARTIFACT_NAME: release-zip

jobs:
  prepare:
    name: Prepare (read version & validate)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.readpkg.outputs.version }}
      pkgname: ${{ steps.readpkg.outputs.name }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - id: readpkg
        name: Read package.json (version & name)
        shell: bash
        run: |
          set -e
          ver=$(jq -r '.version' package.json)
          name=$(jq -r '.name' package.json)
          echo "version=$ver" >> $GITHUB_OUTPUT
          echo "name=$name" >> $GITHUB_OUTPUT

      - name: Validate tag vs package.json (only on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${{ steps.readpkg.outputs.version }}"
          if [ "$TAG" != "$VER" ]; then
            echo "Tag ($TAG) != version ($VER) di package.json"; exit 1
          fi

      - name: Small summary (started)
        shell: bash
        run: |
          echo "Build started for ${{ steps.readpkg.outputs.name }}@${{ steps.readpkg.outputs.version }}" > $GITHUB_STEP_SUMMARY

  build:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: prepare
    outputs:
      zipfile: ${{ steps.pkgzip.outputs.zip }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Core DLL
        run: dotnet build src/AvatarSmartBackups.Core/AvatarSmartBackups.Core.csproj -c Release

      - name: Integrate DLL in package (clean Editor/ and inject asmdef that references DLL)
        shell: bash
        run: |
          set -e
          # Clean Editor folder and recreate it fresh
          rm -rf Editor || true
          mkdir -p Editor
          # Create a minimal asmdef that references the precompiled DLL (runtime is Editor only)
          echo '{' > Editor/AvatarSmartBackups.Editor.asmdef
          echo '  "name": "AvatarSmartBackups.Editor",' >> Editor/AvatarSmartBackups.Editor.asmdef
          echo '  "references": [],' >> Editor/AvatarSmartBackups.Editor.asmdef
          echo '  "includePlatforms": ["Editor"],' >> Editor/AvatarSmartBackups.Editor.asmdef
          echo '  "excludePlatforms": [],' >> Editor/AvatarSmartBackups.Editor.asmdef
          echo '  "allowUnsafeCode": false,' >> Editor/AvatarSmartBackups.Editor.asmdef
          echo '  "overrideReferences": false,' >> Editor/AvatarSmartBackups.Editor.asmdef
          echo '  "precompiledReferences": ["AvatarSmartBackups.Core.dll"],' >> Editor/AvatarSmartBackups.Editor.asmdef
          echo '  "autoReferenced": true,' >> Editor/AvatarSmartBackups.Editor.asmdef
          echo '  "defineConstraints": [],' >> Editor/AvatarSmartBackups.Editor.asmdef
          echo '  "versionDefines": [],' >> Editor/AvatarSmartBackups.Editor.asmdef
          echo '  "noEngineReferences": false' >> Editor/AvatarSmartBackups.Editor.asmdef
          echo '}' >> Editor/AvatarSmartBackups.Editor.asmdef
          # Copy DLL next to the asmdef
          DLL_SRC="src/AvatarSmartBackups.Core/bin/Release/net48/AvatarSmartBackups.Core.dll"
          if [ ! -f "$DLL_SRC" ]; then
            echo "ERROR: DLL not found at $DLL_SRC"
            ls -la src/AvatarSmartBackups.Core/bin/Release || true
            exit 1
          fi
          cp "$DLL_SRC" Editor/

      - id: pkgzip
        name: Create VPM ZIP
        shell: bash
        run: |
          set -e
          NAME="${{ needs.prepare.outputs.pkgname }}"
          VER="${{ needs.prepare.outputs.version }}"
          ZIP="${NAME}-${VER}.zip"
          # ensure package.json and Editor exist
          if [ ! -f package.json ]; then echo "package.json missing"; exit 1; fi
          zip -r "$ZIP" package.json Editor
          echo "zip=$ZIP" >> $GITHUB_OUTPUT

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ steps.pkgzip.outputs.zip }}

  publish:
    name: Publish Release & Update listing
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ./artifact

      - name: Inspect downloaded artifact
        shell: bash
        run: |
          ls -la artifact

      - name: Publish release to PUBLIC repo (dummics/unity-smart-backup) if tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.DIST_REPO_TOKEN }}
          repository: dummics/unity-smart-backup
          tag_name: ${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.version }}
          files: artifact/*

      - name: Checkout listing repo for update (only on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@v4
        with:
          repository: dummics/unity-smart-backup
          token: ${{ secrets.DIST_REPO_TOKEN }}
          path: listing

      - name: Update listing/source.json in public repo (only on tag)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        working-directory: listing
        env:
          VER: ${{ needs.prepare.outputs.version }}
          NAME: ${{ needs.prepare.outputs.pkgname }}
        run: |
          set -euo pipefail
          cd listing

          # Ricalcola tutto QUI dentro
          VER="${VER:-}"
          NAME="${NAME:-}"
          ZIP="${NAME}-${VER}.zip"

          if [[ -z "$VER" || -z "$NAME" ]]; then
            echo "ERROR: NAME/VER vuoti (needs.prepare.outputs non presenti?)"; exit 1
          fi

          # Crea il file se manca
          [ -f source.json ] || echo '{"packages":[]}' > source.json

          # Assicurati che esista il nodo del tuo pacchetto
          if ! jq -e --arg id "$NAME" '.packages[] | select(.id==$id)' source.json >/dev/null; then
            tmp=$(mktemp)
            jq --arg id "$NAME" '.packages += [{id:$id}]' source.json > "$tmp" && mv "$tmp" source.json
          fi

          # Patch “releaseTag” e “asset” (adatta le chiavi alla tua struttura)
          tmp=$(mktemp)
          jq --arg id "$NAME" --arg ver "$VER" --arg zip "$ZIP" '
            (.packages[] | select(.id==$id) | .releaseTag) = $ver
            | (.packages[] | select(.id==$id) | .asset)      = $zip
          ' source.json > "$tmp" && mv "$tmp" source.json

          echo "== source.json aggiornato =="
          jq -r '.packages[] | {id,releaseTag,asset}' source.json

          # Commit solo se serve
          if git diff --quiet -- source.json; then
            echo "Nessuna modifica a source.json, skip."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json
          git commit -m "listing: ${NAME}@${VER} (${ZIP})"
          git pull --ff-only
          git push origin HEAD:main


      - name: Update listing/source.json in public repo (only on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@v4
        with:
          repository: dummics/unity-smart-backup
          token: ${{ secrets.DIST_REPO_TOKEN }}
          path: listing

      - name: Patch listing/source.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        working-directory: listing
        run: |
          set -e
          VER="${{ needs.prepare.outputs.version }}"
          NAME="${{ needs.prepare.outputs.pkgname }}"
          ZIPNAME="${NAME}-${VER}.zip"
          URL="https://github.com/dummics/unity-smart-backup/releases/download/$VER/${ZIPNAME}"

          [ -f source.json ] || echo '{"packages":[]}' > source.json

          jq --arg name "$NAME" --arg url "$URL" '
            (.packages //= []) |
            if (.packages | map(.name) | index($name)) != null then
              (.packages |= map(if .name == $name
                                then (.releases //= []) | .releases += [$url] | .releases |= unique
                                else . end))
            else
              (.packages += [{name: $name, releases: [$url]}])
            end
          ' source.json > source.tmp && mv source.tmp source.json

          if git diff --quiet; then
            echo "Nessuna modifica a source.json, salto commit/push"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json
          git commit -m "Release $NAME v$VER"
          git pull --ff-only
          git push origin HEAD:main

      - name: Final summary (done)
        if: always()
        shell: bash
        run: |
          echo "Build finished for ${{ needs.prepare.outputs.pkgname }}@${{ needs.prepare.outputs.version }}" > $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ZIP artifact: $(ls artifact | head -n1)" >> $GITHUB_STEP_SUMMARY
