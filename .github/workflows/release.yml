name: build-release

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: pkg
        name: Leggi versione da package.json
        shell: bash
        run: |
          ver=$(python3 - <<'PY'
          import json
          print(json.load(open('package.json'))['version'])
          PY
          )
          echo "version=$ver" >> $GITHUB_OUTPUT

      - name: Verifica che il tag combaci con la versione
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${{ steps.pkg.outputs.version }}"
          if [ "$TAG" != "$VER" ]; then
            echo "Tag ($TAG) != version ($VER) di package.json"; exit 1
          fi

      - id: buildzip
        name: Crea ZIP VPM
        shell: bash
        run: |
          NAME=$(python3 - <<'PY'
          import json
          print(json.load(open('package.json'))['name'])
          PY
          )
          VER="${{ steps.pkg.outputs.version }}"
          ZIP="${NAME}-${VER}.zip"
          zip -r "$ZIP" package.json Editor
          echo "zip=$ZIP" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: Pubblica release nella repo PUBBLICA (flowye-backup-tool)
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.DIST_REPO_TOKEN }}   # PAT con write sulla repo pubblica
          repository: dummics/flowye-backup-tool # destinazione
          tag_name: ${{ steps.pkg.outputs.version }}
          name: ${{ steps.pkg.outputs.version }}
          files: ${{ steps.buildzip.outputs.zip }}

      - name: Aggiorna index.json nella repo PUBBLICA
        shell: bash
        run: |
          # Clona la repo pubblica
          git clone https://github.com/dummics/flowye-backup-tool.git listing
          cd listing

          VER="${{ steps.pkg.outputs.version }}"
          NAME="${{ steps.buildzip.outputs.name }}"
          URL="https://github.com/dummics/flowye-backup-tool/releases/download/$VER/${NAME}-${VER}.zip"

          # Aggiorna index.json con jq
          jq ".versions[\"$VER\"] = {\"url\":\"$URL\"}" index.json > index.tmp && mv index.tmp index.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "Add version $VER to index.json"
          git push https://x-access-token:${{ secrets.DIST_REPO_TOKEN }}@github.com/dummics/flowye-backup-tool.git main
