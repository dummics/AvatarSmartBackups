name: build-release
on:
  workflow_dispatch:
  push:
    tags:
      - '*'         # parte quando pushi un tag (es. 1.0.0)

permissions:
  contents: read    # questa repo (privata): basta read; scriviamo nella pubblica con il PAT

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: pkg
        name: Leggi versione da package.json
        shell: bash
        run: |
          ver=$(python3 - <<'PY'
import json
print(json.load(open('package.json'))['version'])
PY
)
          echo "version=$ver" >> $GITHUB_OUTPUT

      - name: Verifica che il tag combaci con la versione
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${{ steps.pkg.outputs.version }}"
          if [ "$TAG" != "$VER" ]; then
            echo "Tag ($TAG) != version ($VER) di package.json"; exit 1
          fi

      - id: buildzip
        name: Crea ZIP VPM
        run: |
          NAME=$(python3 - <<'PY'
import json; print(json.load(open('package.json'))['name'])
PY
)
          VER="${{ steps.pkg.outputs.version }}"
          ZIP="${NAME}-${VER}.zip"
          zip -r "$ZIP" package.json Editor
          echo "zip=$ZIP" >> $GITHUB_OUTPUT

      - name: Pubblica release nella repo PUBBLICA (flowye-backup-tool)
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.DIST_REPO_TOKEN }}                 # PAT con write sulla repo pubblica
          repository: dummics/flowye-backup-tool               # destinazione
          tag_name: ${{ steps.pkg.outputs.version }}           # crea/aggiorna release con stesso tag
          name: ${{ steps.pkg.outputs.version }}
          files: ${{ steps.buildzip.outputs.zip }}
