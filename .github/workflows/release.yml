name: build-release

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Init summary (0%)
        shell: bash
        run: |
          pct=0
          filled=$((pct/10))
          empty=$((10-filled))
          bar="$(printf '█%.0s' $(seq 1 $filled); printf '░%.0s' $(seq 1 $empty))"
          echo "## Build Release" > $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Progress:** $bar $pct%" >> $GITHUB_STEP_SUMMARY

      - uses: actions/checkout@v4

      # Checkout della repo PUBBLICA in ./listing
      - name: Checkout listing repo (pubblica)
        uses: actions/checkout@v4
        with:
          repository: dummics/unity-smart-backup
          token: ${{ secrets.DIST_REPO_TOKEN }}
          path: listing

      - name: Update summary (15%)
        shell: bash
        run: |
          pct=15
          filled=$((pct/10)); empty=$((10-filled))
          bar="$(printf '█%.0s' $(seq 1 $filled); printf '░%.0s' $(seq 1 $empty))"
          echo "## Build Release" > $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Progress:** $bar $pct%" >> $GITHUB_STEP_SUMMARY

      - id: pkg
        name: Leggi versione da package.json
        shell: bash
        run: |
          ver=$(python3 - <<'PY'
          import json
          print(json.load(open('package.json'))['version'])
          PY
          )
          echo "version=$ver" >> $GITHUB_OUTPUT

      - name: Update summary (25%)
        shell: bash
        run: |
          pct=25
          filled=$((pct/10)); empty=$((10-filled))
          bar="$(printf '█%.0s' $(seq 1 $filled); printf '░%.0s' $(seq 1 $empty))"
          echo "## Build Release" > $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Progress:** $bar $pct%" >> $GITHUB_STEP_SUMMARY

      - name: Verifica che il tag combaci con la versione
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${{ steps.pkg.outputs.version }}"
          if [ "$TAG" != "$VER" ]; then
            echo "Tag ($TAG) != version ($VER) di package.json"; exit 1
          fi

      - name: Valida JSON di source.json (repo pubblica)
        shell: bash
        run: jq '.' listing/source.json > /dev/null

      - name: Update summary (35%)
        shell: bash
        run: |
          pct=35
          filled=$((pct/10)); empty=$((10-filled))
          bar="$(printf '█%.0s' $(seq 1 $filled); printf '░%.0s' $(seq 1 $empty))"
          echo "## Build Release" > $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Progress:** $bar $pct%" >> $GITHUB_STEP_SUMMARY

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Update summary (45%)
        shell: bash
        run: |
          pct=45
          filled=$((pct/10)); empty=$((10-filled))
          bar="$(printf '█%.0s' $(seq 1 $filled); printf '░%.0s' $(seq 1 $empty))"
          echo "## Build Release" > $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Progress:** $bar $pct%" >> $GITHUB_STEP_SUMMARY

      - name: Build Core DLL
        run: dotnet build src/AvatarSmartBackups.Core/AvatarSmartBackups.Core.csproj -c Release

      - name: Update summary (65%)
        shell: bash
        run: |
          pct=65
          filled=$((pct/10)); empty=$((10-filled))
          bar="$(printf '█%.0s' $(seq 1 $filled); printf '░%.0s' $(seq 1 $empty))"
          echo "## Build Release" > $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Progress:** $bar $pct%" >> $GITHUB_STEP_SUMMARY

      - name: Integrate DLL in package (put DLL in Editor/ and remove Editor .cs files)
        shell: bash
        run: |
          # Ensure Editor exists
          mkdir -p Editor

          # Copy compiled DLL into Editor (not Plugins)
          cp src/AvatarSmartBackups.Core/bin/Release/net48/AvatarSmartBackups.Core.dll Editor/ || {
            echo "DLL not found at expected path, aborting"; exit 1;
          }

          # Remove all .cs files inside Editor (clean out source .cs placeholders)
          find Editor -type f -name "*.cs" -exec rm -f {} +

      - name: Update summary (75%)
        shell: bash
        run: |
          pct=75
          filled=$((pct/10)); empty=$((10-filled))
          bar="$(printf '█%.0s' $(seq 1 $filled); printf '░%.0s' $(seq 1 $empty))"
          echo "## Build Release" > $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Progress:** $bar $pct%" >> $GITHUB_STEP_SUMMARY

      - id: buildzip
        name: Crea ZIP VPM
        shell: bash
        run: |
          NAME=$(python3 - <<'PY'
          import json
          print(json.load(open('package.json'))['name'])
          PY
          )
          VER="${{ steps.pkg.outputs.version }}"
          ZIP="${NAME}-${VER}.zip"

          # Create zip containing only package.json and Editor folder
          zip -r "$ZIP" package.json Editor

          echo "zip=$ZIP" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: Update summary (85%)
        shell: bash
        run: |
          pct=85
          filled=$((pct/10)); empty=$((10-filled))
          bar="$(printf '█%.0s' $(seq 1 $filled); printf '░%.0s' $(seq 1 $empty))"
          echo "## Build Release" > $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Progress:** $bar $pct%" >> $GITHUB_STEP_SUMMARY

      - name: Pubblica release nella repo PUBBLICA (unity-smart-backup)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.DIST_REPO_TOKEN }}
          repository: dummics/unity-smart-backup
          tag_name: ${{ steps.pkg.outputs.version }}
          name: ${{ steps.pkg.outputs.version }}
          files: ${{ steps.buildzip.outputs.zip }}

      - name: Crea release di test nella repo privata (solo manuale)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: test-${{ steps.pkg.outputs.version }}
          name: Test Release ${{ steps.pkg.outputs.version }}
          files: ${{ steps.buildzip.outputs.zip }}

      - name: Aggiorna source.json nella repo PUBBLICA
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        working-directory: listing
        run: |
          VER="${{ steps.pkg.outputs.version }}"
          NAME="${{ steps.buildzip.outputs.name }}"
          URL="https://github.com/dummics/unity-smart-backup/releases/download/$VER/${NAME}-${VER}.zip"

          [ -f source.json ] || echo '{"packages":[]}' > source.json

          jq --arg name "$NAME" --arg url "$URL" '
            (.packages //= []) |
            if (.packages | map(.name) | index($name)) != null then
              (.packages |= map(if .name == $name
                                then (.releases //= []) | .releases += [$url] | .releases |= unique
                                else . end))
            else
              (.packages += [{name: $name, releases: [$url]}])
            end
          ' source.json > source.tmp && mv source.tmp source.json

          if git diff --quiet; then
            echo "Nessuna modifica a source.json, salto commit/push"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json
          git commit -m "Add $VER for $NAME to source.json"
          git pull --ff-only
          git push origin HEAD:main

      - name: Final summary (100%)
        if: always()
        shell: bash
        run: |
          pct=100
          filled=10
          bar="$(printf '█%.0s' $(seq 1 $filled))"
          echo "## Build Release — Done ✅" > $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Progress:** $bar $pct%" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ZIP: ${{ steps.buildzip.outputs.zip }}" >> $GITHUB_STEP_SUMMARY
