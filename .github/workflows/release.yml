name: build-release

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Checkout della repo PUBBLICA in ./listing
      - name: Checkout listing repo (pubblica)
        uses: actions/checkout@v4
        with:
          repository: dummics/unity-smart-backup
          token: ${{ secrets.DIST_REPO_TOKEN }}
          path: listing

      - id: pkg
        name: Leggi versione da package.json
        shell: bash
        run: |
          ver=$(python3 - <<'PY'
          import json
          print(json.load(open('package.json'))['version'])
          PY
          )
          echo "version=$ver" >> $GITHUB_OUTPUT

      - name: Verifica che il tag combaci con la versione
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${{ steps.pkg.outputs.version }}"
          if [ "$TAG" != "$VER" ]; then
            echo "Tag ($TAG) != version ($VER) di package.json"; exit 1
          fi

      - name: Valida JSON di source.json (repo pubblica)
        shell: bash
        run: jq '.' listing/source.json > /dev/null

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Core DLL
        run: dotnet build src/AvatarSmartBackups.Core/AvatarSmartBackups.Core.csproj -c Release

      - name: Integrate DLL in package
        shell: bash
        run: |
          mkdir -p Plugins
          cp src/AvatarSmartBackups.Core/bin/Release/net48/AvatarSmartBackups.Core.dll Plugins/
          find Editor -name "*.cs" -type f -delete

      - id: buildzip
        name: Crea ZIP VPM
        shell: bash
        run: |
          NAME=$(python3 - <<'PY'
          import json
          print(json.load(open('package.json'))['name'])
          PY
          )
          VER="${{ steps.pkg.outputs.version }}"
          ZIP="${NAME}-${VER}.zip"
          zip -r "$ZIP" package.json Editor Plugins
          echo "zip=$ZIP" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: Pubblica release nella repo PUBBLICA (unity-smart-backup)
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.DIST_REPO_TOKEN }}
          repository: dummics/unity-smart-backup
          tag_name: ${{ steps.pkg.outputs.version }}
          name: ${{ steps.pkg.outputs.version }}
          files: ${{ steps.buildzip.outputs.zip }}

      - name: Aggiorna source.json nella repo PUBBLICA
        shell: bash
        working-directory: listing
        run: |
          VER="${{ steps.pkg.outputs.version }}"
          NAME="${{ steps.buildzip.outputs.name }}"
          URL="https://github.com/dummics/unity-smart-backup/releases/download/$VER/${NAME}-${VER}.zip"

          [ -f source.json ] || echo '{"packages":[]}' > source.json

          jq --arg name "$NAME" --arg url "$URL" '
            (.packages //= []) |
            if (.packages | map(.name) | index($name)) != null then
              (.packages |= map(if .name == $name
                                then (.releases //= []) | .releases += [$url] | .releases |= unique
                                else . end))
            else
              (.packages += [{name: $name, releases: [$url]}])
            end
          ' source.json > source.tmp && mv source.tmp source.json

          if git diff --quiet; then
            echo "Nessuna modifica a source.json, salto commit/push"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json
          git commit -m "Add $VER for $NAME to source.json"
          git pull --ff-only
          git push origin HEAD:main
