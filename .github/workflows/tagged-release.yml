name: unity-plugin-tests

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

jobs:
  test:
    name: Run editor utility tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore tests/AvatarSmartBackups.Tests/AvatarSmartBackups.Tests.csproj

      - name: Run unit tests
        run: dotnet test tests/AvatarSmartBackups.Tests/AvatarSmartBackups.Tests.csproj --configuration Release

  build_core:
    name: Build Core DLL (net48)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore Core
        run: dotnet restore src/AvatarSmartBackups.Core/AvatarSmartBackups.Core.csproj
      - name: Build Core (Release)
        run: dotnet build src/AvatarSmartBackups.Core/AvatarSmartBackups.Core.csproj -c Release -p:ContinuousIntegrationBuild=true
      - name: Upload Core DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: AvatarSmartBackups.Core-net48
          path: src/AvatarSmartBackups.Core/bin/Release/net48/AvatarSmartBackups.Core.dll
