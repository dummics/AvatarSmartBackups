name: build-release

on:
  workflow_dispatch:
    inputs:
      unityImage:
        description: "UnityCI image tag (override, opzionale)"
        required: false
        default: "ghcr.io/dummics/unity-editor-light:2022.3.60f1"
  push:
    tags:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

env:
  # Immagine UnityCI validata da te; puoi overrideare con l'input workflow_dispatch
  UNITY_IMAGE: ${{ github.event.inputs.unityImage || 'ghcr.io/dummics/unity-editor-light:2022.3.60f1' }}
  ARTIFACT_NAME: release-zip

jobs:
  prepare:
    name: Prepare (read version & pkg name)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      pkgname: ${{ steps.meta.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y jq
          fi

      - id: meta
        name: Read package.json
        shell: bash
        run: |
          set -e
          VER=$(jq -r '.version' package.json)
          NAME=$(jq -r '.name' package.json)
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "name=$NAME"   >> $GITHUB_OUTPUT
          echo "Package: $NAME  Version: $VER"

      - name: Validate tag vs package.json (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${{ steps.meta.outputs.version }}"
          TAG_NOV=${TAG#v}
          if [ "$TAG_NOV" != "$VER" ]; then
            echo "Tag ($TAG) != version ($VER) in package.json"; exit 1
          fi

      - name: Summary (started)
        run: echo "Build started for ${{ steps.meta.outputs.name }}@${{ steps.meta.outputs.version }}" > $GITHUB_STEP_SUMMARY

  build:
    name: Build DLL & Package ZIP
    runs-on: ubuntu-latest
    needs: prepare
    outputs:
      zipfile: ${{ steps.pkgzip.outputs.zip }}
    steps:
      - uses: actions/checkout@v4

      # Login a GHCR per accedere a immagini private/pubbliche
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      # === CACHE PERSISTENTE PER DOTNET E NUGET DENTRO IL CONTAINER ===
      - name: Prepare cache dirs (host)
        id: cachedirs
        run: |
          echo "nuget_dir=${RUNNER_TEMP}/nuget-cache" >> $GITHUB_OUTPUT
          echo "dotnet_dir=${RUNNER_TEMP}/dotnet-cache" >> $GITHUB_OUTPUT
          mkdir -p "${RUNNER_TEMP}/nuget-cache"
          mkdir -p "${RUNNER_TEMP}/dotnet-cache"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.cachedirs.outputs.nuget_dir }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Cache .NET SDK (dotnet-install)
        uses: actions/cache@v4
        with:
          path: ${{ steps.cachedirs.outputs.dotnet_dir }}
          key: dotnet-sdk-${{ runner.os }}-8.0

      # === CACHE DOCKER IMAGE ===
      - name: Cache Docker image
        uses: actions/cache@v4
        with:
          path: /tmp/docker-cache
          key: docker-${{ env.UNITY_IMAGE }}-${{ runner.os }}
          restore-keys: |
            docker-unityci-${{ runner.os }}-

      - name: Load cached image or pull fresh
        run: |
          IMAGE="${{ env.UNITY_IMAGE }}"
          if [ -f /tmp/docker-cache/image.tar ]; then
            echo "Loading cached Docker image..."
            docker load < /tmp/docker-cache/image.tar
          else
            echo "Cache miss, pulling fresh image..."
            docker pull "$IMAGE"
            mkdir -p /tmp/docker-cache
            echo "Caching image for next run..."
            docker save "$IMAGE" > /tmp/docker-cache/image.tar
          fi

      - name: Build Core DLL in UnityCI container (fast, no editor launch)
        run: |
          set -e
          
          # Esegui il container con i mount corretti (immagine già caricata dalla cache)
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -v ${{ runner.temp }}/nuget-cache:/root/.nuget/packages \
            -v ${{ runner.temp }}/dotnet-cache:/root/.dotnet \
            -w /workspace \
            ${{ env.UNITY_IMAGE }} \
            bash -c '
              set -e
              export DOTNET_CLI_TELEMETRY_OPTOUT=1
              export DOTNET_NOLOGO=1

              echo "=== Unity Installation Check ==="
              for d in /unity/Managed /opt/unity/Editor/Data/Managed; do
                echo "Trying: $d"
                ls -la "$d" 2>/dev/null | head -20 || true
              done
              echo "================================"

              if ! command -v dotnet >/dev/null 2>&1; then
                curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
                chmod +x dotnet-install.sh
                ./dotnet-install.sh --channel 8.0 --install-dir /root/.dotnet
                export PATH=/root/.dotnet:$PATH
              else
                export PATH=/root/.dotnet:$PATH
              fi
              dotnet --info

              # >>> aggiorna se il .csproj cambia percorso <<<
              PROJ="src/AvatarSmartBackups.Core/AvatarSmartBackups.Core.csproj"

              # ---- AUTO-DETECT UNITY_MANAGED ----
              UNITY_MANAGED=""
              for d in /unity/Managed /opt/unity/Editor/Data/Managed; do
                if [ -d "$d" ]; then UNITY_MANAGED="$d"; break; fi
              done
              if [ -z "$UNITY_MANAGED" ]; then
                CAND=$(find / -maxdepth 5 -type f -name "UnityEditor.dll" 2>/dev/null | head -n 1 || true)
                if [ -n "$CAND" ]; then UNITY_MANAGED="$(dirname "$CAND")"; fi
              fi
              [ -n "$UNITY_MANAGED" ] && [ -d "$UNITY_MANAGED" ] || { echo "ERROR: Managed folder not found"; exit 1; }

              export UNITY_MANAGED
              echo "UNITY_MANAGED set to: $UNITY_MANAGED"

              # ---- Verifica DLL necessarie ----
              [ -f "$UNITY_MANAGED/UnityEditor.dll" ] || { echo "ERROR: UnityEditor.dll not found in $UNITY_MANAGED"; exit 1; }
              if [ -f "$UNITY_MANAGED/UnityEngine.dll" ]; then
                echo "Found UnityEngine at $UNITY_MANAGED/UnityEngine.dll"
              elif [ -f "$UNITY_MANAGED/UnityEngine/UnityEngine.dll" ]; then
                echo "Found UnityEngine at $UNITY_MANAGED/UnityEngine/UnityEngine.dll"
              else
                echo "ERROR: UnityEngine.dll not found under $UNITY_MANAGED"
                exit 1
              fi

              # ---- Build ----
              dotnet restore "$PROJ"
              echo "Building with UNITY_MANAGED=$UNITY_MANAGED"
              dotnet build "$PROJ" -c Release \
                -p:UNITY_MANAGED="$UNITY_MANAGED" \
                -p:WarningsAsErrors=false

              # ---- Individua la DLL prodotta in modo robusto ----
              OUTDIR="$(dirname "$PROJ")/bin/Release"
              echo "Search built DLL under: $OUTDIR"
              FOUND_DLL="$(find "$OUTDIR" -type f -name "AvatarSmartBackups.Core.dll" | head -n1 || true)"
              if [ -z "$FOUND_DLL" ]; then
                echo "WARNING: AvatarSmartBackups.Core.dll not found by name; listing DLLs for debug:"
                find "$OUTDIR" -type f -name "*.dll" -maxdepth 3 -ls || true
                # Prova fallback: prendi la dll più grande che NON sia reference assemblies
                FOUND_DLL="$(find "$OUTDIR" -type f -name "*.dll" -printf "%s %p\n" | sort -nr | awk "NR==1{print \$2}")"
              fi
              if [ -z "$FOUND_DLL" ] || [ ! -f "$FOUND_DLL" ]; then
                echo "ERROR: Compiled DLL not found."
                exit 1
              fi
              echo "Using built DLL: $FOUND_DLL"

              # ---- Prepara Editor/ e copia con nome fisso ----
              rm -rf Editor || true
              mkdir -p Editor
              cat > Editor/AvatarSmartBackups.Editor.asmdef <<'"'"'JSON'"'"'
              {
                "name": "AvatarSmartBackups.Editor",
                "references": [],
                "includePlatforms": ["Editor"],
                "excludePlatforms": [],
                "allowUnsafeCode": false,
                "overrideReferences": false,
                "precompiledReferences": ["AvatarSmartBackups.Core.dll"],
                "autoReferenced": true,
                "defineConstraints": [],
                "versionDefines": [],
                "noEngineReferences": false
              }
              JSON

              # Copia e rinomina se necessario
              install -m 0644 "$FOUND_DLL" "Editor/AvatarSmartBackups.Core.dll"

              echo "Editor folder content after copy:"
              ls -la Editor
            '


            - id: pkgzip
              name: Create VPM ZIP (package.json + Editor/*)
              run: |
                set -e
                NAME="${{ needs.prepare.outputs.pkgname }}"
                VER="${{ needs.prepare.outputs.version }}"
                ZIP="${NAME}-${VER}.zip"
                [ -f package.json ] || (echo "package.json missing" && exit 1)
                mkdir -p artifact
                zip -r "artifact/$ZIP" package.json Editor
                echo "zip=$ZIP" >> $GITHUB_OUTPUT

            - name: Upload ZIP artifact
              uses: actions/upload-artifact@v4
              with:
                name: ${{ env.ARTIFACT_NAME }}
                path: artifact/*.zip

  publish:
    name: Publish Release & Update listing
    runs-on: ubuntu-latest
    needs: [build, prepare]
    steps:
      - name: Download ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ./artifact

      - name: Inspect downloaded artifact
        run: ls -la artifact

      - name: Publish release to PUBLIC repo (softprops) [on tag]
        id: softprops
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.DIST_REPO_TOKEN }}
          repository: dummics/unity-smart-backup
          tag_name: ${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.version }}
          files: artifact/*
          overwrite: true
          generate_release_notes: true

      - name: Fallback publish via gh (retry) [on tag]
        if: startsWith(github.ref, 'refs/tags/') && steps.softprops.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
        run: |
          set -e
          VER="${{ needs.prepare.outputs.version }}"
          REPO="dummics/unity-smart-backup"
          shopt -s nullglob
          ASSETS=(artifact/*)
          echo "softprops failed, attempting gh release fallback..."
          for attempt in 1 2 3; do
            if gh release view "$VER" --repo "$REPO" >/dev/null 2>&1; then
              gh release upload "$VER" "${ASSETS[@]}" --repo "$REPO" --clobber && break || true
            else
              gh release create "$VER" "${ASSETS[@]}" --repo "$REPO" -t "$VER" -n "$VER" && break || true
            fi
            sleep $((attempt*5))
          done

      - name: Checkout listing repo for update (only on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@v4
        with:
          repository: dummics/unity-smart-backup
          token: ${{ secrets.DIST_REPO_TOKEN }}
          path: listing

      - name: Patch listing/source.json
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: listing
        run: |
          set -e
          VER="${{ needs.prepare.outputs.version }}"
          NAME="${{ needs.prepare.outputs.pkgname }}"
          ZIPNAME="${NAME}-${VER}.zip"
          URL="https://github.com/dummics/unity-smart-backup/releases/download/$VER/${ZIPNAME}"

          [ -f source.json ] || echo '{"packages":[]}' > source.json

          # Sanitize + update
          SAN="source.sanitized.json"
          if ! jq '.' source.json >/dev/null 2>&1; then
            perl -0777 -pe 's/,\s*([}\]])/\1/g' source.json > "$SAN"
          else
            cp source.json "$SAN"
          fi

          jq --arg name "$NAME" --arg url "$URL" '
            (.packages //= [])
            | (.packages |= map(select((.name // "") != "")))
            | if (.packages | map(.name) | index($name)) != null then
                (.packages |= map(
                  if .name == $name then
                    (.releases //= []) | .releases += [$url] | .releases |= unique
                  else . end))
              else
                (.packages += [{name: $name, releases: [$url]}])
              end
          ' "$SAN" > source.tmp && mv source.tmp source.json

          jq '.' source.json >/dev/null

          if git diff --quiet; then
            echo "Nessuna modifica a source.json, salto commit/push"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json
          git commit -m "Release $NAME v$VER"
          git pull --ff-only
          git push origin HEAD:main

      - name: Final summary (done)
        if: always()
        run: |
          echo "Build finished for ${{ needs.prepare.outputs.pkgname }}@${{ needs.prepare.outputs.version }}" > $GITHUB_STEP_SUMMARY
          echo "- ZIP artifact: $(ls artifact | head -n1)" >> $GITHUB_STEP_SUMMARY
