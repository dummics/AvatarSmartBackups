name: build-release-full

on:
  workflow_dispatch:
    inputs:
      unityVersion:
        description: "Unity version fallback (es. 2022.3.22f1)"
        required: false
        default: "2022.3.22f1"
  push:
    tags:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  ARTIFACT_NAME: release-zip

jobs:
  prepare:
    name: Prepare (read version & validate)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      pkgname: ${{ steps.meta.outputs.name }}
      unity:   ${{ steps.meta.outputs.unity }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y jq
          fi

      - id: meta
        name: Read package.json metadata
        run: |
          set -e
          VER=$(jq -r '.version' package.json)
          NAME=$(jq -r '.name' package.json)
          UNITY=$(jq -r '.unity' package.json)

          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "name=$NAME"   >> $GITHUB_OUTPUT

          if [ "$UNITY" = "null" ] || [ -z "$UNITY" ]; then
            # fallback manuale se manca
            UNITY="2022.3.22f1"
          fi
          echo "unity=$UNITY" >> $GITHUB_OUTPUT

          echo "Package: $NAME  Version: $VER  Unity: $UNITY"


      - name: Validate tag vs package.json (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${{ steps.meta.outputs.version }}"
          TAG_NOV=${TAG#v}
          if [ "$TAG_NOV" != "$VER" ]; then
            echo "Tag ($TAG) != version ($VER) in package.json"; exit 1
          fi

      - name: Summary (started)
        run: echo "Build started for ${{ steps.meta.outputs.name }}@${{ steps.meta.outputs.version }}" > $GITHUB_STEP_SUMMARY

  build:
    name: Build DLL & Package ZIP
    runs-on: ubuntu-latest
    needs: prepare
    outputs:
      zipfile: ${{ steps.pkgzip.outputs.zip }}
    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub (avoid rate-limit)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pick UnityCI image (try 3.1 then 3.0)
        id: pickimg
        env:
          U: ${{ needs.prepare.outputs.unity }}
        run: |
          set -e
          IMG1="unityci/editor:${U}-base-3.1"
          IMG2="unityci/editor:${U}-base-3.0"
          if docker manifest inspect "$IMG1" >/dev/null 2>&1; then
            echo "image=$IMG1" >> $GITHUB_OUTPUT
          elif docker manifest inspect "$IMG2" >/dev/null 2>&1; then
            echo "image=$IMG2" >> $GITHUB_OUTPUT
          else
            echo "No unityci/editor image for $U (tried $IMG1, $IMG2)"; exit 1
          fi

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build Core DLL in UnityCI container (fast, no editor launch)
        uses: addnab/docker-run-action@v3
        with:
          image: ${{ steps.pickimg.outputs.image }}
          options: -v ${{ github.workspace }}:/workspace -w /workspace
          run: |
            set -e
            export UNITY_MANAGED=/opt/unity/Editor/Data/Managed
            echo "Using UNITY_MANAGED=$UNITY_MANAGED"

            # dotnet SDK (leggero)
            curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
            chmod +x dotnet-install.sh
            ./dotnet-install.sh --channel 8.0
            export PATH=$HOME/.dotnet:$PATH
            dotnet --info

            # >>> modifica se il .csproj cambia posizione <<<
            PROJ="src/AvatarSmartBackups.Core/AvatarSmartBackups.Core.csproj"
            REF_PATH="$UNITY_MANAGED;$UNITY_MANAGED/UnityEngine;$UNITY_MANAGED/UnityEditor"

            dotnet restore "$PROJ"
            dotnet build "$PROJ" -c Release -p:ReferencePath="$REF_PATH" -p:WarningsAsErrors=false

            DLL=src/AvatarSmartBackups.Core/bin/Release/net48/AvatarSmartBackups.Core.dll
            test -f "$DLL" || (echo "DLL non trovata ($DLL)"; ls -la src/AvatarSmartBackups.Core/bin/Release || true; exit 1)

            # Prepara Editor/ con asmdef che referenzia la DLL
            rm -rf Editor || true
            mkdir -p Editor
            cat > Editor/AvatarSmartBackups.Editor.asmdef <<'JSON'
            {
              "name": "AvatarSmartBackups.Editor",
              "references": [],
              "includePlatforms": ["Editor"],
              "excludePlatforms": [],
              "allowUnsafeCode": false,
              "overrideReferences": false,
              "precompiledReferences": ["AvatarSmartBackups.Core.dll"],
              "autoReferenced": true,
              "defineConstraints": [],
              "versionDefines": [],
              "noEngineReferences": false
            }
            JSON
            cp "$DLL" Editor/

      - id: pkgzip
        name: Create VPM ZIP (package.json + Editor/*)
        run: |
          set -e
          NAME="${{ needs.prepare.outputs.pkgname }}"
          VER="${{ needs.prepare.outputs.version }}"
          ZIP="${NAME}-${VER}.zip"
          [ -f package.json ] || (echo "package.json missing" && exit 1)
          zip -r "$ZIP" package.json Editor
          echo "zip=$ZIP" >> $GITHUB_OUTPUT
          mkdir -p artifact && mv "$ZIP" artifact/

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact/*.zip

  publish:
    name: Publish Release & Update listing
    runs-on: ubuntu-latest
    needs: [build, prepare]
    steps:
      - name: Download ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ./artifact

      - name: Inspect downloaded artifact
        run: ls -la artifact

      - name: Publish release to PUBLIC repo (softprops) [on tag]
        id: softprops
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          token: ${{ secrets.DIST_REPO_TOKEN }}
          repository: dummics/unity-smart-backup
          tag_name: ${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.version }}
          files: artifact/*
          overwrite: true
          generate_release_notes: true

      - name: Fallback publish via gh (retry) [on tag]
        if: startsWith(github.ref, 'refs/tags/') && steps.softprops.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
        run: |
          set -e
          VER="${{ needs.prepare.outputs.version }}"
          REPO="dummics/unity-smart-backup"
          shopt -s nullglob
          ASSETS=(artifact/*)
          echo "softprops failed, attempting gh release fallback..."
          for attempt in 1 2 3; do
            if gh release view "$VER" --repo "$REPO" >/dev/null 2>&1; then
              echo "Release exists, uploading assets with clobber (attempt $attempt)"
              gh release upload "$VER" "${ASSETS[@]}" --repo "$REPO" --clobber && break || true
            else
              echo "Creating release $VER (attempt $attempt)"
              gh release create "$VER" "${ASSETS[@]}" --repo "$REPO" -t "$VER" -n "$VER" && break || true
            fi
            echo "Retrying in $((attempt*5))s..."; sleep $((attempt*5))
          done

      - name: Checkout listing repo for update (only on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@v4
        with:
          repository: dummics/unity-smart-backup
          token: ${{ secrets.DIST_REPO_TOKEN }}
          path: listing

      - name: Patch listing/source.json
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: listing
        run: |
          set -e
          VER="${{ needs.prepare.outputs.version }}"
          NAME="${{ needs.prepare.outputs.pkgname }}"
          ZIPNAME="${NAME}-${VER}.zip"
          URL="https://github.com/dummics/unity-smart-backup/releases/download/$VER/${ZIPNAME}"

          [ -f source.json ] || echo '{"packages":[]}' > source.json

          SAN="source.sanitized.json"
          if ! jq '.' source.json >/dev/null 2>&1; then
            perl -0777 -pe 's/,\s*([}\]])/\1/g' source.json > "$SAN"
          else
            cp source.json "$SAN"
          fi

          jq --arg name "$NAME" --arg url "$URL" '
            (.packages //= [])
            | (.packages |= map(select((.name // "") != "")))
            | if (.packages | map(.name) | index($name)) != null then
                (.packages |= map(
                  if .name == $name then
                    (.releases //= []) | .releases += [$url] | .releases |= unique
                  else . end))
              else
                (.packages += [{name: $name, releases: [$url]}])
              end
          ' "$SAN" > source.tmp && mv source.tmp source.json

          jq '.' source.json >/dev/null

          if git diff --quiet; then
            echo "Nessuna modifica a source.json, salto commit/push"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json
          git commit -m "Release $NAME v$VER"
          git pull --ff-only
          git push origin HEAD:main

      - name: Final summary (done)
        if: always()
        run: |
          echo "Build finished for ${{ needs.prepare.outputs.pkgname }}@${{ needs.prepare.outputs.version }}" > $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ZIP artifact: $(ls artifact | head -n1)" >> $GITHUB_STEP_SUMMARY
