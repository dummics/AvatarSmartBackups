name: Publish (reusable)

on:
  workflow_call:

permissions:
  contents: write
  packages: read

env:
  ARTIFACT_NAME: release-zip

jobs:
  publish:
    name: Publish Release & Update listing
    runs-on: linux-runner
    steps:
      - name: Download ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ./artifact

      - name: Inspect downloaded artifact
        run: ls -la artifact

      - name: Publish release to PUBLIC repo (softprops) [on tag]
        id: softprops
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.DIST_REPO_TOKEN }}
          repository: dummics/unity-smart-backup
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: artifact/*
          overwrite_files: true
          generate_release_notes: true

      - name: Force re-upload assets with gh --clobber [on tag]
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
        run: |
          set -e
          # Debug: vediamo cosa contiene l'artifact
          echo "=== DEBUG: Contenuto artifact ==="
          ls -la artifact/
          
          # Prova a leggere version e name dal pacchetto unzip
          mkdir -p tmp && cd tmp
          echo "=== DEBUG: Estrazione package.json ==="
          for z in ../artifact/*.zip; do 
            echo "Processing ZIP: $z"
            if [ -f "$z" ]; then
              unzip -l "$z" | head -20  # mostra contenuto ZIP
              unzip -o "$z" package.json >/dev/null 2>&1 || echo "Failed to extract package.json from $z"
              if [ -f package.json ]; then
                echo "package.json estratto con successo"
                break
              fi
            fi
          done
          
          if [ ! -f package.json ]; then
            echo "ERROR: package.json non trovato dopo estrazione"
            echo "Contenuto directory tmp:"
            ls -la .
            exit 1
          fi
          
          VER=$(jq -r '.version' package.json 2>/dev/null || echo "")
          NAME=$(jq -r '.name' package.json 2>/dev/null || echo "")
          cd ..

          if [ -z "$VER" ] || [ -z "$NAME" ]; then
            echo "WARN: Unable to read version/name from zip; falling back to tag only"
            VER="${GITHUB_REF#refs/tags/}"
          fi

          REPO="dummics/unity-smart-backup"
          shopt -s nullglob
          ASSETS=(artifact/*)
          echo "Ensuring release assets are updated (clobber)..."
          if gh release view "$VER" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$VER" "${ASSETS[@]}" --repo "$REPO" --clobber
          else
            gh release create "$VER" "${ASSETS[@]}" --repo "$REPO" -t "$VER" -n "$VER"
          fi

      - name: Checkout listing repo for update (only on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@v4
        with:
          repository: dummics/unity-smart-backup
          token: ${{ secrets.DIST_REPO_TOKEN }}
          path: listing

      - name: Patch listing/source.json
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: listing
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/}"
          
          # Read version and name from artifact zip (con debug)
          mkdir -p tmp && cd tmp
          echo "=== DEBUG: Estrazione package.json per listing ==="
          echo "Working directory: $(pwd)"
          echo "Cercando artifact in: ${{ github.workspace }}/artifact/"
          ls -la "${{ github.workspace }}/artifact/" || echo "Directory artifact non trovata"
          # Assicurati che il globbing funzioni
          shopt -s nullglob
          for z in "${{ github.workspace }}"/artifact/*.zip; do 
            if [ -f "$z" ]; then
              echo "Processing ZIP: $z"
              unzip -o "$z" package.json >/dev/null 2>&1 || echo "Failed to extract package.json from $z"
              if [ -f package.json ]; then
                echo "package.json estratto con successo"
                break
              fi
            else
              echo "No ZIP files found in ${{ github.workspace }}/artifact/"
            fi
          done
          
          if [ ! -f package.json ]; then
            echo "ERROR: package.json non trovato, uso fallback con tag"
            VER="${TAG}"
            NAME="dum.incb.system"  # Nome corretto del pacchetto VPM
          else
            VER=$(jq -r '.version' package.json)
            NAME=$(jq -r '.name' package.json)
          fi
          cd ..
          
          echo "Using: NAME=$NAME, VER=$VER"
          ZIPNAME="${NAME}-${VER}.zip"
          URL="https://github.com/dummics/unity-smart-backup/releases/download/${TAG}/${ZIPNAME}"
          NOW="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          [ -f source.json ] || echo '{"packages":[]}' > source.json

          echo "=== DEBUG: source.json prima dell'aggiornamento ==="
          cat source.json | jq '.'

          # Aggiorna source.json in modo più robusto
          jq --arg name "$NAME" --arg url "$URL" --arg now "$NOW" '
            # Assicurati che packages esista
            if .packages == null then .packages = [] else . end
            |
            # Rimuovi eventuali pacchetti con nome vuoto
            .packages |= map(select(.name != null and .name != ""))
            |
            # Trova il pacchetto esistente o creane uno nuovo
            if (.packages | map(.name) | index($name)) != null then
              # Pacchetto esistente: aggiorna updatedAt e aggiungi release
              .packages |= map(
                if .name == $name then
                  .updatedAt = $now
                  | if .releases == null then .releases = [] else . end
                  | .releases += [$url]
                  | .releases |= unique
                else 
                  .
                end
              )
            else
              # Nuovo pacchetto: aggiungilo
              .packages += [{
                name: $name,
                updatedAt: $now,
                releases: [$url]
              }]
            end
          ' source.json > source.tmp && mv source.tmp source.json

          echo "=== DEBUG: source.json dopo l'aggiornamento ==="
          cat source.json | jq '.'

          # Verifica che il JSON sia valido
          if ! jq '.' source.json >/dev/null 2>&1; then
            echo "ERROR: source.json non è un JSON valido!"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json
          git commit -m "Release $NAME $VER (@${TAG}) – update listing at $NOW"

          git remote set-url origin "https://x-access-token:${{ secrets.DIST_REPO_TOKEN }}@github.com/dummics/unity-smart-backup.git"
          git pull --ff-only
          git push origin HEAD:main

      - name: Final summary (done)
        if: always()
        run: |
          echo "Publish finished" > $GITHUB_STEP_SUMMARY
          echo "- ZIP artifact: $(ls artifact | head -n1)" >> $GITHUB_STEP_SUMMARY
