name: Unity EditMode Tests

on:
  workflow_dispatch:
  # Se vuoi eseguire i test automaticamente su PR e push, decommenta le righe qui sotto
  pull_request:
    branches:
      - versioning-main
      - master
  push:
    branches:
      - versioning-main
      - master

concurrency:
  group: unity-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unity-tests:
    name: Run Unity EditMode tests (2022.3)
    runs-on: ubuntu-latest
    # Job eseguito solo se hai configurato il secret UNITY_LICENSE
    if: ${{ secrets.UNITY_LICENSE != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        with:
          unityVersion: 2022.3.0f1
          testMode: editmode
          projectPath: .
          githubToken: ${{ secrets.GITHUB_TOKEN }}
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

  unity-tests-skip:
    name: Skip Unity tests (no license configured)
    runs-on: ubuntu-latest
    if: ${{ secrets.UNITY_LICENSE == '' }}
    steps:
      - name: Skip message
        run: echo "UNITY_LICENSE not set; skipping Unity tests. Configure the secret to enable."
