name: Avatar Smart Backup Release (Orchestrator)
run-name: Release ${{ github.ref_name }} - Avatar Smart Backup

on:
  workflow_dispatch: {}
  push:
    tags:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

env:
  ARTIFACT_NAME: release-zip

jobs:
  prepare:
    name: Prepare
    uses: ./.github/workflows/prepare.yaml
    secrets: inherit

  build:
    name: Build (Windows net48)
    needs: prepare
    uses: ./.github/workflows/build.yaml
    with:
      project: ./src/AvatarSmartBackups.Core/AvatarSmartBackups.Core.csproj
      configuration: Release
    secrets: inherit

  publish:
    name: Publish
    needs: [build, prepare]
    uses: ./.github/workflows/publish.yaml
    secrets: inherit
