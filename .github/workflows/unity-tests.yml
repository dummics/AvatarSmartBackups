name: unity-editmode-tests

on:
  workflow_dispatch:
  # pull_request:
  #   branches:
  #     - versioning-main
  #     - master

jobs:
  unity-tests:
    name: Run Unity EditMode tests (2022.3)
    runs-on: ubuntu-latest
    if: ${{ secrets.UNITY_LICENSE != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        with:
          unityVersion: 2022.3.0f1
          testMode: editmode
          projectPath: .
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

  unity-tests-skip:
    name: Skip Unity tests (no license configured)
    runs-on: ubuntu-latest
    if: ${{ secrets.UNITY_LICENSE == '' }}
    steps:
      - name: Skip message
        run: echo "UNITY_LICENSE not set; skipping Unity tests. Configure the secret to enable."