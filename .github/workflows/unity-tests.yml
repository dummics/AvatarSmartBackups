name: unity-plugin-tests

on:
  workflow_dispatch:
  #push:
   # tags:
   #   - "*"

jobs:
  test:
    name: Run editor utility tests
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore tests/AvatarSmartBackups.Tests/AvatarSmartBackups.Tests.csproj

      - name: Run unit tests
        run: dotnet test tests/AvatarSmartBackups.Tests/AvatarSmartBackups.Tests.csproj --configuration Release

  build_core:
    name: Build Core DLL (net48)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Core (Release) in UnityCI container
        uses: addnab/docker-run-action@v3
        with:
          image: unityci/editor:2022.3.22f1-base-3.0
          options: -v ${{ github.workspace }}:/workspace -w /workspace
          run: |
            set -e
            export UNITY_MANAGED=/opt/unity/Editor/Data/Managed
            # Install dotnet SDK locally for this container session
            curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
            chmod +x dotnet-install.sh
            ./dotnet-install.sh --channel 8.0
            export PATH=$HOME/.dotnet:$PATH
            dotnet --info
            dotnet restore src/AvatarSmartBackups.Core/AvatarSmartBackups.Core.csproj
            dotnet build src/AvatarSmartBackups.Core/AvatarSmartBackups.Core.csproj -c Release -p:ContinuousIntegrationBuild=true
      - name: Upload Core DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: AvatarSmartBackups.Core-net48
          path: src/AvatarSmartBackups.Core/bin/Release/net48/AvatarSmartBackups.Core.dll
