name: Build (reusable Windows net48)

on:
  workflow_call:
    inputs:
      project:
        description: Path a .sln o .csproj
        required: false
        type: string
        default: .
      configuration:
        description: Configurazione build
        required: false
        type: string
        default: Release
    outputs:
      zipfile:
        description: Nome file zip VPM generato
        value: ${{ jobs.build.outputs.zipfile }}

permissions:
  contents: write

env:
  ARTIFACT_NAME: release-zip

jobs:
  build:
    name: Build DLL & Package ZIP (Windows net48)
    # Usa il tuo runner self-hosted Windows:
    runs-on: windows-runner
    # Se vuoi poter usare anche GitHub-hosted: cambia a "windows-latest"
    outputs:
      zipfile: ${{ steps.pkgzip.outputs.zip }}

    steps:
      - uses: actions/checkout@v4

      - name: Checkout Unity Managed DLLs
        uses: actions/checkout@v4
        with:
          repository: dummics/unity-managed-libs # la repo che hai creato
          ref: main
          path: unity-libs
          token: ${{ secrets.DLL_ACCESS_TOKEN }} # PAT con permesso repo
      # Cache NuGet (standard)
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\NuGet\Cache
            ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj', '**/*.sln') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # (Opzionale) Forza una versione di .NET SDK, utile su hosted
      # - uses: actions/setup-dotnet@v4
      #   with:
      #     dotnet-version: '8.0.x'

      # IMPORTANTISSIMO: trovare UNITY_MANAGED (Unity installata o cartella unity-libs nel repo)
      - name: Locate UNITY_MANAGED
        shell: pwsh
        run: |
          $cands = @(
            $env:UNITY_MANAGED,
            "${{ github.workspace }}\unity-libs",  # fallback: cartella nel repo
            "C:\Program Files\Unity\Hub\Editor\2022.3.60f1\Editor\Data\Managed",
            "C:\Program Files\Unity\Hub\Editor\2022.3.22f1\Editor\Data\Managed"
          )
          $found = $null
          foreach ($p in $cands) {
            if ([string]::IsNullOrWhiteSpace($p)) { continue }
            if (Test-Path (Join-Path $p 'UnityEditor.dll')) { $found = $p; break }
          }
          if (-not $found) {
            Write-Error "UnityEditor.dll non trovato. Installa Unity sul runner oppure committa unity-libs nel repo."; exit 1
          }
          "UNITY_MANAGED=$found" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "::notice::UNITY_MANAGED set to $found"

      - name: Restore
        shell: pwsh
        run: dotnet restore "${{ inputs.project }}"

      # Compila .NET Framework 4.8
      - name: Build net48
        shell: pwsh
        run: |
          dotnet build "${{ inputs.project }}" -c "${{ inputs.configuration }}" -f net48 --no-restore `
            -p:UNITY_MANAGED="${env:UNITY_MANAGED}" `
            -p:WarningsAsErrors=false `
            -p:AppendTargetFrameworkToOutputPath=false

      # Raccogli DLL net48 e prepara cartella temporanea pulita
      - name: Prepare clean package folder
        shell: pwsh
        run: |
          # Crea cartella temporanea pulita per la distribuzione
          New-Item -ItemType Directory -Force -Path temp-package\Editor | Out-Null
          
          # Cerca prima nel path standard con target framework
          $dlls = Get-ChildItem -Recurse -Include *.dll -Path . |
            Where-Object { $_.FullName -match "\\bin\\${{ inputs.configuration }}\\net48\\" }
          # Fallback: cerca in bin\Release\ (quando AppendTargetFrameworkToOutputPath=false)
          if ($dlls.Count -eq 0) { 
            $dlls = Get-ChildItem -Recurse -Include *.dll -Path . |
              Where-Object { $_.FullName -match "\\bin\\${{ inputs.configuration }}\\" -and $_.Name -like "*AvatarSmartBackups*" }
          }
          if ($dlls.Count -eq 0) { Write-Error "Nessuna DLL trovata"; exit 1 }
          
          # Copia solo le DLL nella cartella temporanea
          foreach ($d in $dlls) {
            Copy-Item $d.FullName -Destination "temp-package\Editor\$($d.Name)" -Force
            Write-Host "Copiata DLL: $($d.Name)"
          }
          
          # Copia package.json nella cartella temporanea
          Copy-Item package.json -Destination temp-package\package.json -Force
          
          # Copia la cartella Resources se esiste (maiuscolo per compatibilità pacchetti Unity)
          if (Test-Path Resources) {
            Copy-Item Resources -Destination temp-package\Resources -Recurse -Force
            Write-Host "Copiata cartella Resources"
          }
          
          Write-Host "=== Contenuto finale del package ==="
          Write-Host "Root files:"; Get-ChildItem temp-package -Name
          Write-Host "Editor files:"; Get-ChildItem temp-package\Editor -Name
          if (Test-Path temp-package\Resources) {
            Write-Host "Resources files:"; Get-ChildItem temp-package\Resources -Name
          }

      # Crea lo ZIP VPM (package.json + Editor/* dalla cartella temporanea)
      - id: pkgzip
        name: Create VPM ZIP
        shell: pwsh
        run: |
          if (-not (Test-Path temp-package\package.json)) { throw "package.json mancante nella cartella temporanea" }
          Write-Host "=== DEBUG: Contenuto package.json ==="
          Get-Content temp-package\package.json | Write-Host
          $pkg = Get-Content temp-package\package.json | ConvertFrom-Json
          $name = $pkg.name
          $ver  = $pkg.version
          Write-Host "Estratto: name='$name', version='$ver'"
          if (-not $name -or -not $ver) { throw "name/version mancanti in package.json" }
          $zip = "$name-$ver.zip"
          Write-Host "Nome ZIP finale: $zip"
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          
          # Comprimi dalla cartella temporanea (DLL + package.json + Resources)
          Push-Location temp-package
          $itemsToCompress = @("package.json", "Editor")
          if (Test-Path Resources) { $itemsToCompress += "Resources" }
          Compress-Archive -Path $itemsToCompress -DestinationPath "..\artifact\$zip" -Force
          Pop-Location
          
          Write-Host "ZIP creato in: artifact\$zip"
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact/*.zip
